name: Send Chat test

on:
  push:
    branches: [main]
    paths:
      - scripts/publish_chat_inbound_test.sh
      - .github/workflows/send-chat-test.yml
  workflow_dispatch:
    inputs:
      email:
        description: "Workspace-email (DM)"
        required: false
        default: "ipad@info.opendoors.fi"
        type: string
      text:
        description: "Testiviestin teksti"
        required: false
        default: "Hei — Hermes testi GitHub Actionsista"
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Pub/Sub → Hermes → Chat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load GCP from registry
        run: bash scripts/github_actions_load_gcp_env.sh

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER != '' && secrets.GCP_WIF_PROVIDER || env.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA_EMAIL != '' && secrets.GCP_DEPLOY_SA_EMAIL || env.GCP_DEPLOY_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Publish inbound Chat event
        env:
          EMAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.email || 'ipad@info.opendoors.fi' }}
          TEXT: ${{ github.event_name == 'workflow_dispatch' && inputs.text || 'Hei ipad — Hermes yhteydessä (GitHub testi)' }}
        run: bash scripts/publish_chat_inbound_test.sh
