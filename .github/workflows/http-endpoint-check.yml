name: HTTP endpoint check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config/tenants/registry.json
      - scripts/repair_mac_chat.sh
      - scripts/ensure_mac_gateway_running.sh
      - scripts/chat_registry.py
      - .github/workflows/http-endpoint-check.yml

jobs:
  check:
    name: Funnel smoke (expect 401/403)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip when Pub/Sub transport
        id: mode
        run: |
          TRANSPORT="$(python3 -c "import json; print(json.load(open('config/tenants/registry.json'))['default_chat_transport'])")"
          if [[ "${TRANSPORT}" == "pubsub" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "OK — Pub/Sub mode, HTTP endpoint check skipped"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Check Chat inbound HTTP URL
        if: steps.mode.outputs.skip != 'true'
        run: |
          INBOUND="$(python3 scripts/chat_registry.py inbound-url)"
          HOST="$(python3 -c "import json; print(json.load(open('config/tenants/registry.json')).get('chat_inbound_host',''))")"
          echo "Inbound host: ${HOST:-default}"
          echo "URL: ${INBOUND}"
          python3 scripts/chat_registry.py summary | head -20
          CODE="000"
          for attempt in 1 2 3 4 5; do
            CODE="$(curl -sS -o /dev/null -w '%{http_code}' -X POST "${INBOUND}" \
              -H 'Content-Type: application/json' -d '{}' --max-time 25 2>/dev/null || echo 000)"
            echo "attempt ${attempt}: ${INBOUND} → HTTP ${CODE}"
            [[ "${CODE}" == "401" || "${CODE}" == "403" ]] && break
            [[ "${CODE}" == "502" || "${CODE}" == "503" || "${CODE}" == "000" ]] && sleep 15
          done
          if [[ "${CODE}" == "401" || "${CODE}" == "403" ]]; then
            echo "OK — Chat inbound endpoint valmis"
            exit 0
          fi
          echo "::error::Chat inbound ${INBOUND} expected 401/403, got ${CODE}"
          echo "502/000 = gateway tai API server ei kuuntele hostilla ${HOST}"
          echo "Mac: cd ~/hermes-google-chat && git pull && bash scripts/repair_mac_chat.sh"
          exit 1
