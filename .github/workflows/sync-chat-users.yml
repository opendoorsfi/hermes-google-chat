name: Sync Chat users

# Tavoite: käyttäjä antaa vain sähköpostin → agentti commitoi registry.json → tämä workflow.
# GCP + (valinnainen) Hermes-host self-hosted runner.
#
# GCP-projekti: config/tenants/registry.json → od-kansiot (hermes-chat).
# WIF: secrets GCP_WIF_PROVIDER + GCP_DEPLOY_SA_EMAIL (ks. scripts/setup_github_wif.sh).

on:
  push:
    branches: [main]
    paths:
      - config/tenants/registry.json
  workflow_dispatch:
    inputs:
      email:
        description: "Lisää käyttäjä (workspace-email), esim. ipad@info.opendoors.fi"
        required: false
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: sync-chat-users
  cancel-in-progress: true

jobs:
  register:
    name: Registry → manifests
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      funnel_ok: ${{ steps.check.outputs.funnel_ok }}
      chat_transport: ${{ steps.hub.outputs.chat_transport }}
      primary_tenant: ${{ steps.hub.outputs.primary_tenant }}
    steps:
      - uses: actions/checkout@v4

      - name: Add user from workflow_dispatch
        if: inputs.email != ''
        run: python3 scripts/chat_registry.py add "${{ inputs.email }}"

      - name: Commit registry update (workflow_dispatch)
        if: inputs.email != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/tenants/registry.json
          if git diff --cached --quiet; then
            echo "No registry change"
          else
            git commit -m "chore: add Chat user ${{ inputs.email }} [skip ci]"
            git push
          fi

      - name: Generate tenant manifests
        run: python3 scripts/chat_registry.py generate-all

      - name: Check funnel URL
        id: check
        run: |
          FUNNEL="$(python3 -c "import json; print(json.load(open('config/tenants/registry.json'))['funnel_base_url'])")"
          if [[ "${FUNNEL}" == *tailXXXX* || -z "${FUNNEL}" ]]; then
            echo "::warning::funnel_base_url on placeholder — päivitä config/tenants/registry.json (infra kerran)"
            echo "funnel_ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "funnel_ok=true" >> "$GITHUB_OUTPUT"
          fi

      - id: matrix
        run: |
          MATRIX="$(python3 scripts/chat_registry.py matrix-json)"
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

      - id: hub
        run: |
          HUB="$(python3 scripts/chat_registry.py hub-json)"
          echo "chat_transport=$(python3 -c "import json,sys; print(json.loads(sys.argv[1])['transport'])" "${HUB}")" >> "$GITHUB_OUTPUT"
          echo "primary_tenant=$(python3 -c "import json,sys; print(json.loads(sys.argv[1])['primary_tenant'])" "${HUB}")" >> "$GITHUB_OUTPUT"

  chat-app:
    name: Hermes Chat app (Pub/Sub + GCP)
    needs: register
    if: needs.register.outputs.chat_transport == 'pubsub'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - run: python3 scripts/chat_registry.py generate-all

      - name: Load GCP from registry
        run: bash scripts/github_actions_load_gcp_env.sh

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER != '' && secrets.GCP_WIF_PROVIDER || env.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA_EMAIL != '' && secrets.GCP_DEPLOY_SA_EMAIL || env.GCP_DEPLOY_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Provision Hermes Chat app (automatic from hub)
        env:
          TENANT: ${{ needs.register.outputs.primary_tenant }}
          HERMES_CHAT_TRANSPORT: pubsub
        run: bash scripts/provision_hermes_chat_app.sh | tee provision.log

      - name: Ensure Chat SA in Secret Manager
        run: bash scripts/ensure_chat_sa_secret.sh

      - uses: actions/upload-artifact@v4
        with:
          name: chat-app-setup
          path: |
            out/chat-app/CHAT_APP_SETUP.md
            out/tenants/${{ needs.register.outputs.primary_tenant }}/CHAT_APP_SETUP.md
            provision.log
          retention-days: 90

  gcp:
    name: GCP (${{ matrix.tenant }})
    needs: register
    if: needs.register.outputs.matrix != '{"tenant":[]}'
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.register.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate manifest
        run: python3 scripts/chat_registry.py generate-all

      - name: Load GCP from registry
        run: bash scripts/github_actions_load_gcp_env.sh

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER != '' && secrets.GCP_WIF_PROVIDER || env.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA_EMAIL != '' && secrets.GCP_DEPLOY_SA_EMAIL || env.GCP_DEPLOY_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Verify GCP access
        env:
          TENANT: ${{ matrix.tenant }}
        run: |
          # shellcheck source=scripts/lib/tenant.sh
          source scripts/lib/tenant.sh
          load_tenant "${TENANT}"
          TOPIC="${CHAT_PUBSUB_TOPIC:-hermes-chat-events}"
          if [[ "${CHAT_TRANSPORT:-pubsub}" == "pubsub" ]]; then
            gcloud pubsub topics describe "${TOPIC}" --project="${GCP_PROJECT}" >/dev/null
            echo "OK: Pub/Sub topic ${TOPIC} (${GCP_PROJECT})"
          else
            gcloud services list --project="${GCP_PROJECT}" --enabled --limit=1 >/dev/null
            echo "OK: project ${GCP_PROJECT}"
          fi

      - name: setup_tenant_gcp.sh (HTTP tenants only)
        if: needs.register.outputs.chat_transport != 'pubsub'
        env:
          TENANT: ${{ matrix.tenant }}
          ALLOW_PLACEHOLDER_FUNNEL: ${{ needs.register.outputs.funnel_ok != 'true' && '1' || '0' }}
        run: bash infra/setup_tenant_gcp.sh

      - name: SA JSON (Secret Manager or create key)
        env:
          TENANT: ${{ matrix.tenant }}
        run: bash scripts/ensure_chat_sa_artifact.sh "${{ matrix.tenant }}" || true

      - name: Grant Chat SA impersonation (org policy: no JSON keys)
        run: bash infra/grant_chat_sa_impersonation.sh || true

      - uses: actions/upload-artifact@v4
        with:
          name: tenant-${{ matrix.tenant }}-gcp
          path: |
            out/tenants/${{ matrix.tenant }}/gcp.env
            out/tenants/${{ matrix.tenant }}/CHAT_CONSOLE_CHECKLIST.md
            out/tenants/${{ matrix.tenant }}/hermes-chat-bot-sa.json
          if-no-files-found: ignore
          retention-days: 7

  notify:
    name: User instructions
    needs: [register, chat-app, gcp]
    if: always() && needs.register.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Chat install summary
        run: |
          HUB="$(python3 scripts/chat_registry.py hub-json)"
          APP_NAME="$(python3 -c "import json,sys; print(json.loads(sys.argv[1])['chat_app_display_name'])" "${HUB}")"
          GCP="$(python3 -c "import json,sys; print(json.loads(sys.argv[1])['gcp_project'])" "${HUB}")"
          CONSOLE="$(python3 -c "import json,sys; print(json.loads(sys.argv[1])['console_url'])" "${HUB}")"
          TOPIC="$(python3 -c "import json,sys; print(json.loads(sys.argv[1])['pubsub_topic'])" "${HUB}")"
          {
            echo "## Google Chat — synkattu GitHub Hubista"
            echo
            python3 scripts/chat_registry.py summary
            echo "### Hermes-botti (projekti \`${GCP}\`, ei AzuraCast/moderointi)"
            echo "- App: **${APP_NAME}** (yksi app, monta käyttäjää)"
            INBOUND="$(python3 scripts/chat_registry.py inbound-url)"
            if [[ "${{ needs.register.outputs.chat_transport }}" == "pubsub" ]]; then
              echo "- Pub/Sub + SA: luotu automaattisesti (job **Hermes Chat app**)"
              echo "- **Console-Save (kerran):** [Chat API Configuration](${CONSOLE})"
              echo "  - App name → **${APP_NAME}**"
              echo "  - Connection → Pub/Sub → \`projects/${GCP}/topics/${TOPIC}\`"
              echo "  - Visibility → registryn käyttäjät"
            else
              echo "- **Console-Save (kerran):** [Chat API Configuration](${CONSOLE})"
              echo "  - App name → **${APP_NAME}**"
              echo "  - Connection → HTTP endpoint URL → \`${INBOUND}\`"
              echo "  - Authentication audience → **HTTP endpoint URL** (ei Project number)"
              echo "  - Visibility → registryn käyttäjät"
            fi
            if [[ "${{ needs.register.outputs.funnel_ok }}" != "true" ]]; then
              echo "> **Infra:** Päivitä \`config/tenants/registry.json\` → \`funnel_base_url\` (Tailscale Funnel, kerran)."
            fi
            echo "### Host (gateway + Funnel) — aja host-koneella:"
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/opendoorsfi/hermes-google-chat/main/scripts/start_hermes_now.sh | bash"
            echo '```'
            echo "Tai asenna runner → Actions → **Hermes host sync** → Run workflow."
          } >> "$GITHUB_STEP_SUMMARY"
