name: Deploy Pub/Sub gateway (Cloud Run)

# Vaihtoehto work-h self-hosted runnerille: gateway Cloud Runissa vetää subscriptionin.
# Käynnistyy Sync Chat users -workflow'n jälkeen tai manuaalisesti.

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Sync Chat users"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-pubsub-gateway.yml
      - scripts/deploy_pubsub_gateway.sh
      - deploy/cloudrun/deploy.sh
      - deploy/Dockerfile
      - deploy/entrypoint.sh

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-pubsub-gateway
  cancel-in-progress: true

jobs:
  deploy:
    name: Cloud Run Pub/Sub gateway
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Load GCP from registry
        run: bash scripts/github_actions_load_gcp_env.sh

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER != '' && secrets.GCP_WIF_PROVIDER || env.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA_EMAIL != '' && secrets.GCP_DEPLOY_SA_EMAIL || env.GCP_DEPLOY_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Sync OPENROUTER_API_KEY → Secret Manager (jos GitHub secret asetettu)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          GCP="$(python3 scripts/chat_registry.py hub-json | python3 -c "import json,sys; print(json.load(sys.stdin)['gcp_project'])")"
          if [[ -z "${OPENROUTER_API_KEY}" ]]; then
            CURRENT="$(gcloud secrets versions access latest --secret=hermes-llm-api-key --project="${GCP}" 2>/dev/null || true)"
            if [[ "${CURRENT}" == REPLACE_WITH_* || -z "${CURRENT}" ]]; then
              echo "::error::hermes-llm-api-key on placeholder. Aseta GitHub secret OPENROUTER_API_KEY tai päivitä Secret Manager."
              exit 1
            fi
            echo "OK — hermes-llm-api-key on jo asetettu Secret Managerissa"
          else
            echo -n "${OPENROUTER_API_KEY}" | gcloud secrets versions add hermes-llm-api-key \
              --data-file=- --project="${GCP}"
            echo "OK — hermes-llm-api-key päivitetty Secret Managerista"
          fi

      - name: Deploy Pub/Sub gateway
        run: bash scripts/deploy_pubsub_gateway.sh | tee deploy.log

      - name: Verify Cloud Run service
        run: |
          GCP="$(python3 scripts/chat_registry.py hub-json | python3 -c "import json,sys; print(json.load(sys.stdin)['gcp_project'])")"
          gcloud run services describe hermes-gateway \
            --project="${GCP}" \
            --region=europe-north1 \
            --format="yaml(status.conditions,spec.template.spec.serviceAccountName)"

      - name: Job summary
        if: always()
        run: |
          HUB="$(python3 scripts/chat_registry.py hub-json)"
          GCP="$(python3 -c "import json,sys; print(json.loads(sys.argv[1])['gcp_project'])" "${HUB}")"
          SUB="$(python3 -c "import json,sys; print(json.loads(sys.argv[1])['pubsub_subscription_full'])" "${HUB}")"
          {
            echo "## Pub/Sub gateway — Cloud Run"
            echo ""
            echo "- Projekti: \`${GCP}\`"
            echo "- Subscription: \`${SUB}\`"
            echo "- **Console Save:** [Chat API](https://console.cloud.google.com/apis/api/chat.googleapis.com/hangouts-chat?project=${GCP})"
            echo "  - Connection → Pub/Sub → \`projects/${GCP}/topics/hermes-chat-events\`"
            echo "  - Status → **Live** → Save"
            echo ""
            echo "Testaa Chatissa (Find apps) → lähetä **Hei**"
            if [[ -f deploy.log ]]; then
              echo ""
              echo '```'
              tail -30 deploy.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
