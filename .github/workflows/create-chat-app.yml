name: Create Hermes Chat app (GCP)

# GCP + Console-ohje (transport registrystä: http tai pubsub).

on:
  workflow_dispatch:
    inputs:
      tenant:
        description: "Tenant id (tyhjä = registry inbound tenant)"
        required: false
        default: ""
        type: string
  push:
    branches: [main]
    paths:
      - scripts/provision_hermes_chat_app.sh
      - .github/workflows/create-chat-app.yml
      - config/tenants/registry.json

permissions:
  contents: read
  id-token: write

jobs:
  provision:
    name: GCP + Chat app setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: python3 scripts/chat_registry.py generate-all

      - name: Load GCP from registry
        run: bash scripts/github_actions_load_gcp_env.sh

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER != '' && secrets.GCP_WIF_PROVIDER || env.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA_EMAIL != '' && secrets.GCP_DEPLOY_SA_EMAIL || env.GCP_DEPLOY_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Provision Hermes Chat app
        env:
          TENANT: ${{ github.event.inputs.tenant }}
        run: |
          HUB="$(python3 scripts/chat_registry.py hub-json)"
          TRANSPORT="$(python3 -c "import json,sys; print(json.loads(sys.argv[1])['transport'])" "${HUB}")"
          PRIMARY="$(python3 -c "import json,sys; print(json.loads(sys.argv[1])['primary_tenant'])" "${HUB}")"
          export TENANT="${TENANT:-${PRIMARY}}"
          export HERMES_CHAT_TRANSPORT="${TRANSPORT}"
          echo "tenant=${TENANT} transport=${HERMES_CHAT_TRANSPORT}"
          bash scripts/provision_hermes_chat_app.sh | tee provision.log

      - name: Ensure Chat SA in Secret Manager
        if: always()
        run: bash scripts/ensure_chat_sa_secret.sh

      - uses: actions/upload-artifact@v4
        with:
          name: chat-app-setup
          path: |
            out/chat-app/CHAT_APP_SETUP.md
            out/tenants/*/CHAT_APP_SETUP.md
            out/tenants/*/CHAT_CONSOLE_CHECKLIST.md
            provision.log
          if-no-files-found: ignore
          retention-days: 90

      - name: Summary
        run: |
          HUB="$(python3 scripts/chat_registry.py hub-json)"
          {
            echo "## Hermes Chat app"
            python3 -c "import json,sys; h=json.loads(sys.argv[1]); print(f\"**Projekti:** \`{h['gcp_project']}\`  **App:** {h['chat_app_display_name']}  **Transport:** {h['transport']}\")" "${HUB}"
            echo
            echo "**Console HTTP URL (yksi Save):** \`$(python3 scripts/chat_registry.py inbound-url)\`"
            echo
            echo "**Console:** $(python3 -c "import json,sys; print(json.loads(sys.argv[1])['console_url'])" "${HUB}")"
            echo
            cat "out/chat-app/CHAT_APP_SETUP.md" 2>/dev/null \
              || echo "_(katso provision.log / CHAT_CONSOLE_CHECKLIST artifact)_"
          } >> "$GITHUB_STEP_SUMMARY"
