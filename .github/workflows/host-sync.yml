name: Hermes host sync

# Self-hosted runner (label: hermes-host) — agent-macbook-pro / muut registry-hostit.
# Käynnistyy automaattisesti Sync Chat users -workflow'n jälkeen.

on:
  workflow_run:
    workflows: ["Sync Chat users"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/repair_mac_chat.sh
      - scripts/setup_chat_outbound_auth.sh
      - scripts/bootstrap_hermes_mac.sh
      - scripts/sync_mac_pubsub_from_registry.sh
      - scripts/sync_host_from_registry.sh
      - scripts/print_tenant_env.sh
      - .github/workflows/host-sync.yml
      - config/tenants/registry.json

jobs:
  host:
    name: Sync gateway + outbound auth
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, hermes-host]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Sync Hermes host (Linux or macOS)
        run: |
          TRANSPORT="$(python3 -c "import json; print(json.load(open('config/tenants/registry.json'))['default_chat_transport'])")"
          GATEWAY_HOST="$(python3 scripts/chat_registry.py hub-json | python3 -c "import json,sys; print(json.load(sys.stdin)['chat_gateway_host'])")"
          LOCAL_HOST="${HERMES_HOST_ID:-$(python3 scripts/chat_registry.py local-host-id 2>/dev/null || true)}"
          if [[ "$(uname -s)" == "Darwin" ]]; then
            if [[ "${TRANSPORT}" == "pubsub" && ( -z "${LOCAL_HOST}" || "${LOCAL_HOST}" == "${GATEWAY_HOST}" ) ]]; then
              bash scripts/sync_mac_pubsub_from_registry.sh
            else
              EMAIL="$(python3 scripts/chat_registry.py host-users "${LOCAL_HOST:-natalia-mac}" | python3 -c "import json,sys; u=json.load(sys.stdin); print(u[0]['GOOGLE_CHAT_ALLOWED_USERS'] if u else 'natalia@info.opendoors.fi')")"
              bash scripts/repair_mac_chat.sh "${EMAIL}"
            fi
          else
            sudo HERMES_HOST_ID="${LOCAL_HOST}" bash scripts/sync_host_from_registry.sh
          fi

      - name: Smoke test gateway
        run: |
          TRANSPORT="$(python3 -c "import json; print(json.load(open('config/tenants/registry.json'))['default_chat_transport'])")"
          if [[ "${TRANSPORT}" == "pubsub" ]]; then
            ENV_FILE="${HOME}/.hermes/.env"
            for key in GOOGLE_CHAT_SUBSCRIPTION_NAME HERMES_CHAT_TRANSPORT; do
              if ! grep -q "^${key}=" "${ENV_FILE}" 2>/dev/null; then
                echo "VIRHE: ${key} puuttuu ${ENV_FILE}"
                exit 1
              fi
            done
            if [[ ! -s "${HOME}/.hermes/secrets/google-chat-sa.json" ]]; then
              echo "VAROITUS: SA JSON puuttuu — odota Sync Chat users artefaktia"
            fi
            if [[ "$(uname -s)" == "Darwin" ]]; then
              hermes gateway status 2>/dev/null || pgrep -fl "hermes gateway" || true
            else
              source scripts/lib/tenant.sh
              load_tenant ipad
              systemctl is-active "hermes-gateway@${LINUX_USER}.service" || true
            fi
            echo "OK — Pub/Sub .env + gateway tarkistettu"
          else
            if [[ "$(uname -s)" == "Darwin" ]]; then
              PORT=8642
            else
              source scripts/lib/tenant.sh
              load_tenant ipad
              PORT="${PORT:-8081}"
            fi
            CODE="$(curl -sS -o /dev/null -w '%{http_code}' -X POST "http://127.0.0.1:${PORT}/api/platforms/google_chat/events" \
              -H 'Content-Type: application/json' -d '{}' 2>/dev/null || echo 000)"
            echo "local gateway HTTP ${CODE} (401/403 = OK)"
          fi
