name: Inspect Chat GCP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/inspect_chat_gcp.sh
      - .github/workflows/inspect-chat-gcp.yml

permissions:
  contents: read
  id-token: write

env:
  GCP_WIF_PROVIDER: projects/381850973284/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  GCP_DEPLOY_SA_EMAIL: github-azuracast-deploy@od-azuracast-sync.iam.gserviceaccount.com

jobs:
  inspect:
    name: GCP Chat infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER != '' && secrets.GCP_WIF_PROVIDER || env.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA_EMAIL != '' && secrets.GCP_DEPLOY_SA_EMAIL || env.GCP_DEPLOY_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Inspect Chat GCP
        run: bash scripts/inspect_chat_gcp.sh | tee inspect-output.txt

      - name: Job summary
        run: |
          {
            echo "## Chat GCP inspect — od-azuracast-sync"
            echo '```'
            cat inspect-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
