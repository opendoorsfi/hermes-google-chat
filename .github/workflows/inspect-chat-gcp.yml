name: Inspect Chat GCP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/inspect_chat_gcp.sh
      - .github/workflows/inspect-chat-gcp.yml

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    name: GCP Chat infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/gcp-wif
        with:
          wif_provider: ${{ secrets.GCP_WIF_PROVIDER != '' && secrets.GCP_WIF_PROVIDER || env.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA_EMAIL != '' && secrets.GCP_DEPLOY_SA_EMAIL || env.GCP_DEPLOY_SA_EMAIL }}

      - name: Inspect Chat GCP
        run: bash scripts/inspect_chat_gcp.sh | tee inspect-output.txt

      - name: Job summary
        run: |
          GCP="$(python3 scripts/chat_registry.py hub-json | python3 -c "import json,sys; print(json.load(sys.stdin)['gcp_project'])")"
          {
            echo "## Chat GCP inspect — ${GCP}"
            echo '```'
            cat inspect-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
